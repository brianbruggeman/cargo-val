[package]
name = "cargo-val"
version = "0.1.0"
edition = "2024"
description = "A Proxima-based Cargo test runner, invoked as cargo val."
license = "MIT OR Apache-2.0"
repository = "https://github.com/brianbruggeman/cargo-val"
readme = "README.md"
keywords = ["cargo", "test", "runner", "testing", "cli"]
categories = ["development-tools::testing", "development-tools::cargo-plugins", "command-line-utilities"]
include = [
    "src/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/tests/fixtures/help-banner.txt",
]

[[bin]]
name = "cargo-val"
path = "src/main.rs"
required-features = ["edge-os", "proxima-core", "proxima-codec", "proxima-primitives"]

[dev-dependencies]
proxima = { package = "proxima-lib", version = "0.1.0", default-features = false, features = ["test-support", "test-prime"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
temp-env = "0.3.6"

[features]
default = ["edge-os", "proxima-core", "proxima-codec", "proxima-primitives"]
proxima-codec = ["dep:proxima-codec"]
proxima-primitives = ["dep:proxima-primitives"]
proxima-core = ["dep:proxima-core"]
edge-os = ["dep:prime", "dep:proxima-runtime", "proxima-primitives/alloc"]

[dependencies]
conflaguration = { version = "2.0.0", default-features = false, features = ["derive", "alloc"] }
memchr = { version = "2.8.3", default-features = false }
prime = { package = "proxima-prime", version = "0.1.0", default-features = false, features = ["std", "runtime-prime-executor", "runtime-prime-reactor", "runtime-prime-inbox-alloc", "runtime-prime-timer"], optional = true }
proxima-codec = { version = "0.1.0", default-features = false, optional = true }
proxima-core = { version = "0.1.0", default-features = false, features = ["io-async"], optional = true }
proxima-primitives = { version = "0.1.0", default-features = false, optional = true }
proxima-runtime = { version = "0.1.0", default-features = false, optional = true }

[build-dependencies]
conflaguration = { version = "2.0.0", features = ["derive", "codegen"] }

[target."cfg(unix)".dependencies]
libc = { version = "0.2.190", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Console", "Win32_System_JobObjects"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bench]]
name = "failure_class"
harness = false
