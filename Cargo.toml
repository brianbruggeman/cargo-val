[package]
name = "cargo-val"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[features]
proxima-codec = ["dep:proxima-codec"]
proxima-primitives = ["dep:proxima-primitives"]
prime = ["dep:prime"]

[dependencies]
prime = { git = "https://github.com/brianbruggeman/proxima.git", rev = "6cffdc693bbd34483f1349f99b0ebd282c92fca4", version = "0.1.0", default-features = false, features = ["runtime-prime-executor"], optional = true }
proxima-codec = { git = "https://github.com/brianbruggeman/proxima.git", rev = "6cffdc693bbd34483f1349f99b0ebd282c92fca4", version = "0.1.0", default-features = false, optional = true }
proxima-primitives = { git = "https://github.com/brianbruggeman/proxima.git", rev = "6cffdc693bbd34483f1349f99b0ebd282c92fca4", version = "0.1.0", default-features = false, optional = true }

[build-dependencies]
conflaguration = { git = "https://github.com/brianbruggeman/conflaguration.git", rev = "3eb325d84fc291df35528e6781b5b814884e2d28", version = "2.0.0", features = ["derive", "codegen"] }
