name: native tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_test_floor: 246
            lib_test_args: ""
            integration_test_floor: 128
            integration_test_args: ""
          - os: macos-latest
            lib_test_floor: 250
            lib_test_args: ""
            integration_test_floor: 381
            integration_test_args: ""
          # windows edge tests assert process-wide handle counts, which parallel tests perturb
          - os: windows-latest
            lib_test_floor: 233
            lib_test_args: "-- --test-threads=1"
            integration_test_floor: 341
            integration_test_args: "--test-threads=1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test with failure payload
        shell: bash
        env:
          LIB_TEST_FLOOR: ${{ matrix.lib_test_floor }}
          LIB_TEST_ARGS: ${{ matrix.lib_test_args }}
        run: |
          set +e
          set -o pipefail
          cargo test --no-default-features --features proxima-codec,proxima-primitives,proxima-core,edge-os --lib $LIB_TEST_ARGS 2>&1 | tee cargo-test-output.txt
          test_status=$?
          cat cargo-test-output.txt
          lib_count="$(awk '/^test result: / { print $4; exit }' cargo-test-output.txt)"
          floor_status=0
          if [ -z "$lib_count" ] || [ "$lib_count" -lt "$LIB_TEST_FLOOR" ]; then
            printf '::error title=lib test count below floor::passed=%s floor=%s\n' "${lib_count:-none}" "$LIB_TEST_FLOOR"
            floor_status=1
          fi
          echo "lib tests parsed: ${lib_count:-none} (floor $LIB_TEST_FLOOR, cargo exit $test_status)"
          if [ "$test_status" -ne 0 ]; then
            failure_excerpt="$(awk 'found || /^failures:/ { found = 1; print }' cargo-test-output.txt | tail -c 8000 | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | awk '{ if (NR > 1) printf "%%0A"; printf "%s", $0 }')"
            printf '::error title=native cargo test failure::exit status %s%%0A%s\n' "$test_status" "$failure_excerpt"
            exit "$test_status"
          fi
          if [ "$floor_status" -ne 0 ]; then
            exit 1
          fi
          echo "lib tests passed: $lib_count (floor $LIB_TEST_FLOOR)"
      - name: Run integration tests and assert their count
        timeout-minutes: 60
        shell: bash
        env:
          INTEGRATION_TEST_FLOOR: ${{ matrix.integration_test_floor }}
          INTEGRATION_TEST_ARGS: ${{ matrix.integration_test_args }}
        run: |
          set +e
          set -o pipefail
          : > integration-test-output.txt
          binaries_failed=0
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --locked --tests --no-run --message-format=json > integration-build.json
            build_status=$?
            if [ "$build_status" -ne 0 ]; then
              printf '::error title=integration test build failed::exit status %s\n' "$build_status"
              exit "$build_status"
            fi
            jq -r 'select(.reason == "compiler-artifact" and .executable != null and (.target.kind | index("test"))) | .executable' integration-build.json > integration-executables.txt
            executable_count="$(wc -l < integration-executables.txt | tr -d ' ')"
            echo "integration test binaries: $executable_count"
            if [ "$executable_count" -eq 0 ]; then
              printf '::error title=no integration test binaries found::the json build listed none\n'
              exit 1
            fi
            while IFS= read -r executable; do
              binary_name="$(basename "$executable")"
              started_at="$(date +%s)"
              timeout 600 "$executable" $INTEGRATION_TEST_ARGS < /dev/null > binary-output.txt 2>&1
              binary_status=$?
              cat binary-output.txt
              cat binary-output.txt >> integration-test-output.txt
              echo "binary $binary_name exit $binary_status secs $(( $(date +%s) - started_at ))"
              if [ "$binary_status" -eq 124 ]; then
                printf '::error title=integration test binary timed out::%s ran past 600s\n' "$binary_name"
              fi
              if [ "$binary_status" -ne 0 ]; then
                binaries_failed=1
              fi
            done < integration-executables.txt
          else
            cargo test --locked --tests --no-fail-fast $( [ -n "$INTEGRATION_TEST_ARGS" ] && echo "-- $INTEGRATION_TEST_ARGS" ) 2>&1 | tee integration-test-output.txt
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              binaries_failed=1
            fi
          fi
          integration_count="$(tr -d '\r' < integration-test-output.txt | awk '/^test result: ok\./ { total += $4 } END { print total + 0 }')"
          floor_status=0
          if [ "$integration_count" -eq 0 ] || [ "$integration_count" -lt "$INTEGRATION_TEST_FLOOR" ]; then
            printf '::error title=integration test count below floor::passed=%s floor=%s\n' "$integration_count" "$INTEGRATION_TEST_FLOOR"
            floor_status=1
          fi
          echo "integration tests parsed: $integration_count (floor $INTEGRATION_TEST_FLOOR, failures $binaries_failed)"
          if [ "$binaries_failed" -ne 0 ]; then
            printf '::error title=integration cargo test failure::one or more integration test runs exited nonzero\n'
            exit 1
          fi
          exit "$floor_status"
      - name: Run dylib environment fixture against cargo test
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --test dylib_fixture
      - name: Build the release cargo-val binary
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --locked --release --bin cargo-val
      - name: Compare cargo val with cargo test on the fixture workspace
        if: runner.os == 'Windows'
        shell: bash
        run: cargo run --locked --release --example parity

  windows-pipe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run clippy over Windows library and test code
        shell: bash
        run: cargo clippy --locked --lib --tests -- -D clippy::pedantic -D warnings
      - name: Build Windows test executable
        shell: bash
        run: cargo test --no-default-features --features proxima-codec,proxima-primitives,proxima-core,edge-os --lib --no-run
      - name: Run C45b stdout completion test
        shell: bash
        run: bash .github/scripts/run-c45b-case.sh host::windows_pipe::tests::c45b_reads_borrowed_bytes_and_preserves_the_unread_suffix
      - name: Run C45b cancellation completion test
        shell: bash
        run: bash .github/scripts/run-c45b-case.sh host::windows_pipe::tests::c45b_retains_storage_until_cancel_completion
      - name: Run C45b synchronous EOF test
        shell: bash
        run: bash .github/scripts/run-c45b-case.sh host::windows_pipe::tests::c45b_reports_synchronous_eof_without_an_iocp_packet
      - name: Run the Windows edge tests
        shell: bash
        run: cargo test --locked --lib edge_ -- --test-threads=1

  scale:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the release cargo-val binary
        shell: bash
        run: cargo build --locked --release --bin cargo-val
      - name: Time cargo val against cargo test and nextest at 13k tests
        shell: bash
        run: cargo run --locked --release --example scale
      - name: Time one test-binary launch per spawn path
        shell: bash
        run: cargo run --locked --release --example launch_cost
      - name: Time a spawn-once proxima worker pool at 13k tests
        shell: bash
        run: cargo run --locked --release --example worker_scale
