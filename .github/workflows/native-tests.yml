name: native tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test with failure payload
        shell: bash
        run: |
          set +e
          cargo test --no-default-features --features proxima-codec,proxima-primitives,proxima-core --lib -- --test-threads=1 > cargo-test-output.txt 2>&1
          test_status=$?
          cat cargo-test-output.txt
          if [ "$test_status" -ne 0 ]; then
            failure_excerpt="$(awk 'found || /^failures:/ { found = 1; print }' cargo-test-output.txt | tail -c 8000 | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | awk '{ if (NR > 1) printf "%%0A"; printf "%s", $0 }')"
            printf '::error title=native cargo test failure::exit status %s%%0A%s\n' "$test_status" "$failure_excerpt"
          fi
          exit "$test_status"

  windows-pipe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused Windows IOCP tests
        shell: bash
        run: cargo test --no-default-features --features proxima-codec,proxima-primitives,proxima-core --lib host::windows_pipe::tests::c45b_ -- --nocapture --test-threads=1
